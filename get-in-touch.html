    <!-- Tema applicato PRIMA del render per evitare flash -->

            document.documentElement.classList.add('inverted-early');
        }
    </script>
</head>
<body>
    <div class="custom-cursor"></div>
    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html" class="navbar-link">home</a>
        <a href="about-me.html" class="navbar-link">about me</a>
        <a href="get-in-touch.html" class="navbar-link">get in touch</a>
    </div>

    <main class="container">
        <nav class="navbar">
            <a href="../index.html" class="navbar-logo" aria-label="Home">
                <img src="../assets/logo-gg.svg" alt="GG Logo">
            </a>
            <div class="navbar-links">
                <a href="../index.html" class="navbar-link">home</a>
                <a href="../about-me.html" class="navbar-link">about me</a>
                <a href="../get-in-touch.html" class="navbar-link">get in touch</a>
            </div>
            <button class="hamburger" aria-label="Menu" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
        <header class="page-header">
            <div class="page-title-row">
                <span class="page-title-bold">get in touch!</span>
            </div>
        </header>

        <!-- FORM + CONTATTI - layout a due colonne -->
<!-- FORM + CONTATTI - layout a due colonne -->
<div class="contact-grid">

  <!-- Colonna sinistra: contatti in basso -->
  <div class="contact-info-col">
  <h2 class="info-heading">contact me</h2>
  <ul class="contact-list">
    
    <!-- 1. Email - Icona busta -->
    <li class="contact-item">
      <i class="fa-regular fa-envelope contact-icon"></i>
      <a href="mailto:gretaa.franco@gmail.com" class="contact-link">gretaa.franco@gmail.com</a>
    </li>
    
    <!-- 2. User/Nome - Icona utente -->
    <li class="contact-item">
      <i class="fa-regular fa-user contact-icon"></i>
      <a href="#" class="contact-link">Greta Franco</a>
    </li>
    
    <!-- 3. Instagram/Social - Icona Instagram (o camera) -->
    <li class="contact-item">
      <i class="fa-brands fa-instagram contact-icon"></i>
      <a href="#" class="contact-link">@gretafranco.design</a>
    </li>
    
  </ul>
</div>

  <!-- Colonna destra: form -->
  <div class="contact-form-col">
    <h2 class="form-heading">send me a message</h2>
    <form class="contact-form" action="#" method="post">
      <div class="form-group">
        <label for="name">name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="email">email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="message">message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
     <button type="submit" class="send-button">
  <i class="fa-regular fa-paper-plane"></i>
  <span>send message!</span>
</button>
    </form>
  </div>

</div>
      
    </main>
    <script src="../js/global.js"></script>
    <script src="../js/theme-manager.js"></script>
    <script src="../js/projects.js"></script>
</body>
